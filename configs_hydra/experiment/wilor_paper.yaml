# @package _global_
# Paper training schedule with selected official WiLoR implementation details.
# Official perspective projection and feature sampling; data recipe remains local.
# Source: https://arxiv.org/html/2409.12259v2#A7.SS2
defaults:
  - hamer_vit_transformer.yaml
  - override /data: freihand_full.yaml

dataset_config: datasets_freihand_paper.yaml

TRAIN:
  PAPER_MODE: true
  OFFICIAL_LOSSES: true
  OPTIMIZER: adamw
  REFERENCE_PER_RANK_BATCH_SIZE: 128
  LR: 1e-5
  WEIGHT_DECAY: 1e-4
  # Author clarification: issue #19, 8 GPUs, effective batch 1024.
  BATCH_SIZE: 128
  NUM_TRAIN_SAMPLES: 1

MODEL:
  PROJECTION: perspective
  PAPER_LITERAL: true
  # Explicit override: official 16 pose + 1 shape + 1 camera tokens.
  NUM_POSE_TOKENS: 16

MANO:
  MEAN_PARAMS: mano_data/mano_mean_params.npz

LOSS_WEIGHTS:
  VERTICES_3D: 0.0
  KEYPOINTS_3D: 0.05
  KEYPOINTS_2D: 0.01
  GLOBAL_ORIENT: 0.001
  HAND_POSE: 0.001
  BETAS: 0.0005
  ADVERSARIAL: 0.0005

DATASETS:
  # Do not turn unavailable shape labels into zero-shape ground truth.
  BETAS_REG: false
  # Local single-dataset epoch definition, not specified by the paper.
  FINITE_FREIHAND: true
  # Keep every optimizer update at the author's effective batch size (1024).
  DROP_LAST_TRAIN: true
  FREIHAND_HOLDOUT: 0.1
  CONFIG:
    # Published WiLoR checkpoint config includes translation augmentation.
    TRANS_FACTOR: 0.02
    TRANS_AUG_RATE: 0.5

trainer:
  max_epochs: 1000
  max_steps: -1
  strategy: ddp_find_unused_parameters_true
  val_check_interval: 1.0
  limit_val_batches: 1.0
  # Precision is not published; use full precision instead of assuming BF16.
  precision: 32-true

seed: 42
exp_name: wilor_paper
