<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">WiLoR hand reconstruction network architecture</title>
  <desc id="desc">Architecture diagram showing an RGB hand crop, ViTPose-H style vision transformer, MANO initialization and camera estimates, multi-scale vertex feature refinement, final MANO reconstruction, and training losses.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .heading { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; fill: #475569; }
      .box { stroke-width: 1.6; rx: 14; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .data-arrow { fill: none; stroke: #2563eb; stroke-width: 2.4; marker-end: url(#arrowBlue); }
      .skip { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .train { fill: none; stroke: #d97706; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#f8fafc"/>
  <text x="800" y="48" text-anchor="middle" class="title">WiLoR 手部三维重建网络示意图</text>
  <text x="800" y="76" text-anchor="middle" class="subtitle">基于代码中的 WiLoR + ViT backbone + 多尺度顶点特征细化；训练监督支路以虚线标示</text>

  <!-- Input and backbone -->
  <rect x="42" y="130" width="185" height="100" fill="#e0f2fe" stroke="#0284c7" class="box"/>
  <text x="134" y="164" text-anchor="middle" class="heading">RGB 手部图像</text>
  <text x="134" y="191" text-anchor="middle" class="body">256 × 256</text>
  <text x="134" y="214" text-anchor="middle" class="small">batch 输入</text>

  <rect x="270" y="130" width="205" height="100" fill="#e0f2fe" stroke="#0284c7" class="box"/>
  <text x="372" y="164" text-anchor="middle" class="heading">中心裁剪</text>
  <text x="372" y="191" text-anchor="middle" class="body">左右各去 32 px</text>
  <text x="372" y="214" text-anchor="middle" class="small">得到 256 × 192</text>
  <path d="M227 180 H263" class="data-arrow"/>

  <rect x="520" y="104" width="595" height="220" fill="#eff6ff" stroke="#3b82f6" class="box"/>
  <text x="817" y="134" text-anchor="middle" class="heading">ViTPose-H 风格 Vision Transformer Backbone</text>
  <rect x="545" y="157" width="157" height="95" fill="#dbeafe" stroke="#60a5fa" class="box"/>
  <text x="623" y="187" text-anchor="middle" class="body">Patch Embedding</text>
  <text x="623" y="211" text-anchor="middle" class="small">16 × 16 / stride 16</text>
  <text x="623" y="233" text-anchor="middle" class="small">192 个图像 tokens</text>
  <rect x="725" y="157" width="167" height="95" fill="#dbeafe" stroke="#60a5fa" class="box"/>
  <text x="808" y="184" text-anchor="middle" class="body">拼接参数 tokens</text>
  <text x="808" y="209" text-anchor="middle" class="small">Pose 16 + Shape 1</text>
  <text x="808" y="232" text-anchor="middle" class="small">+ Camera 1（均值初始化）</text>
  <rect x="915" y="157" width="175" height="95" fill="#bfdbfe" stroke="#3b82f6" class="box"/>
  <text x="1002" y="187" text-anchor="middle" class="body">Transformer × 32</text>
  <text x="1002" y="211" text-anchor="middle" class="small">16 heads · dim 1280</text>
  <text x="1002" y="233" text-anchor="middle" class="small">注意力 + MLP 残差块</text>
  <path d="M702 205 H718" class="arrow"/>
  <path d="M892 205 H908" class="arrow"/>
  <path d="M475 180 H512" class="data-arrow"/>

  <rect x="1160" y="120" width="190" height="90" fill="#ede9fe" stroke="#8b5cf6" class="box"/>
  <text x="1255" y="153" text-anchor="middle" class="heading">初始回归</text>
  <text x="1255" y="180" text-anchor="middle" class="body">Pose 96 · Shape 10</text>
  <text x="1255" y="201" text-anchor="middle" class="small">Camera 3（相对均值残差）</text>
  <path d="M1115 169 H1152" class="data-arrow"/>

  <rect x="1160" y="230" width="190" height="75" fill="#ede9fe" stroke="#8b5cf6" class="box"/>
  <text x="1255" y="261" text-anchor="middle" class="heading">图像特征图</text>
  <text x="1255" y="286" text-anchor="middle" class="body">1280 × 16 × 12</text>
  <path d="M1115 246 C1135 246 1135 267 1152 267" class="data-arrow"/>

  <!-- Initial MANO -->
  <rect x="1378" y="120" width="180" height="135" fill="#f3e8ff" stroke="#a855f7" class="box"/>
  <text x="1468" y="154" text-anchor="middle" class="heading">初始 MANO</text>
  <text x="1468" y="181" text-anchor="middle" class="body">Pose + Shape</text>
  <text x="1468" y="205" text-anchor="middle" class="body">→ 初始 3D 顶点</text>
  <text x="1468" y="232" text-anchor="middle" class="small">用于投影和取特征</text>
  <path d="M1350 164 H1370" class="data-arrow"/>

  <!-- RefineNet detail -->
  <rect x="42" y="375" width="1516" height="405" fill="#f0fdf4" stroke="#22c55e" class="box"/>
  <text x="800" y="408" text-anchor="middle" class="heading">RefineNet：基于初始 MANO 顶点的多尺度特征细化</text>

  <rect x="75" y="445" width="205" height="97" fill="#dcfce7" stroke="#4ade80" class="box"/>
  <text x="177" y="478" text-anchor="middle" class="body">图像特征图</text>
  <text x="177" y="505" text-anchor="middle" class="body">1280 × 16 × 12</text>
  <text x="177" y="528" text-anchor="middle" class="small">来自 ViT 图像 tokens</text>

  <rect x="320" y="445" width="215" height="97" fill="#dcfce7" stroke="#4ade80" class="box"/>
  <text x="427" y="478" text-anchor="middle" class="body">1 × 1 Conv</text>
  <text x="427" y="505" text-anchor="middle" class="body">1280 → 640 通道</text>
  <text x="427" y="528" text-anchor="middle" class="small">空间尺寸 16 × 12</text>
  <path d="M280 493 H312" class="arrow"/>

  <rect x="578" y="435" width="280" height="75" fill="#ecfccb" stroke="#84cc16" class="box"/>
  <text x="718" y="465" text-anchor="middle" class="body">尺度分支 A：反卷积 ×4</text>
  <text x="718" y="491" text-anchor="middle" class="small">640 → 320 → 160 · 64 × 48</text>
  <rect x="578" y="525" width="280" height="75" fill="#ecfccb" stroke="#84cc16" class="box"/>
  <text x="718" y="555" text-anchor="middle" class="body">尺度分支 B：反卷积 ×2</text>
  <text x="718" y="581" text-anchor="middle" class="small">640 → 320 · 32 × 24</text>
  <rect x="578" y="615" width="280" height="75" fill="#ecfccb" stroke="#84cc16" class="box"/>
  <text x="718" y="645" text-anchor="middle" class="body">尺度分支 C：基础特征</text>
  <text x="718" y="671" text-anchor="middle" class="small">640 通道 · 16 × 12</text>
  <path d="M535 493 H558 V472 H570" class="arrow"/>
  <path d="M535 493 H558 V562 H570" class="arrow"/>
  <path d="M535 493 H558 V652 H570" class="arrow"/>

  <rect x="900" y="465" width="260" height="165" fill="#dcfce7" stroke="#4ade80" class="box"/>
  <text x="1030" y="497" text-anchor="middle" class="body">顶点投影与特征采样</text>
  <text x="1030" y="525" text-anchor="middle" class="small">初始 3D 顶点 + 相机参数</text>
  <text x="1030" y="549" text-anchor="middle" class="small">→ 投影到三个尺度的 2D 网格</text>
  <text x="1030" y="573" text-anchor="middle" class="small">grid_sample 采样顶点特征</text>
  <text x="1030" y="603" text-anchor="middle" class="small">各尺度沿顶点维 max pooling</text>
  <path d="M858 472 H882 V497 H892" class="arrow"/>
  <path d="M858 562 H892" class="arrow"/>
  <path d="M858 652 H882 V597 H892" class="arrow"/>
  <path d="M1468 255 V352 H1030 V457" class="skip"/>
  <text x="1215" y="345" text-anchor="middle" class="small">初始顶点 / 相机</text>

  <rect x="1202" y="465" width="325" height="165" fill="#d1fae5" stroke="#22c55e" class="box"/>
  <text x="1364" y="497" text-anchor="middle" class="body">拼接多尺度特征</text>
  <text x="1364" y="525" text-anchor="middle" class="small">160 + 320 + 640 = 1120 维</text>
  <text x="1364" y="557" text-anchor="middle" class="body">Linear 1120 → ΔPose 96</text>
  <text x="1364" y="583" text-anchor="middle" class="body">Linear 1120 → ΔShape 10</text>
  <text x="1364" y="609" text-anchor="middle" class="body">Linear 1120 → ΔCamera 3</text>
  <path d="M1160 548 H1194" class="data-arrow"/>

  <rect x="340" y="710" width="850" height="48" fill="#fef3c7" stroke="#f59e0b" class="box"/>
  <text x="765" y="740" text-anchor="middle" class="body">残差更新：初始 Pose / Shape / Camera + 对应 Δ → 细化后的 MANO 参数与相机</text>
  <path d="M1364 630 V682 H1165 V702" class="data-arrow"/>
  <path d="M1255 305 V354 H360 V702" class="skip"/>
  <text x="605" y="349" text-anchor="middle" class="small">初始 MANO 参数（残差基准）</text>

  <!-- Final output and training losses -->
  <rect x="265" y="850" width="310" height="105" fill="#f3e8ff" stroke="#a855f7" class="box"/>
  <text x="420" y="883" text-anchor="middle" class="heading">最终 MANO 解码</text>
  <text x="420" y="911" text-anchor="middle" class="body">旋转矩阵 + Shape β</text>
  <text x="420" y="936" text-anchor="middle" class="small">生成手部网格与 3D 关节</text>
  <path d="M530 758 V817 H420 V842" class="data-arrow"/>

  <rect x="660" y="850" width="310" height="105" fill="#e0f2fe" stroke="#0284c7" class="box"/>
  <text x="815" y="883" text-anchor="middle" class="heading">相机投影</text>
  <text x="815" y="911" text-anchor="middle" class="body">细化 Camera + 焦距</text>
  <text x="815" y="936" text-anchor="middle" class="small">3D 关节 → 2D 关键点</text>
  <path d="M760 758 V817 H815 V842" class="data-arrow"/>
  <path d="M575 902 H652" class="arrow"/>

  <rect x="1060" y="835" width="470" height="150" fill="#fff7ed" stroke="#f97316" class="box"/>
  <text x="1295" y="866" text-anchor="middle" class="heading">训练监督（仅训练阶段）</text>
  <text x="1295" y="895" text-anchor="middle" class="body">L = 0.05 L₃ᴅ + 0.01 L₂ᴅ + 参数损失</text>
  <text x="1295" y="923" text-anchor="middle" class="small">MANO 参数：Global Orient / Hand Pose / Betas</text>
  <text x="1295" y="951" text-anchor="middle" class="small">可选对抗损失：当 ADVERSARIAL 权重 &gt; 0 时启用</text>
  <path d="M970 902 H1052" class="train"/>
  <path d="M420 963 V1020 H1295 V993" class="train"/>

  <rect x="65" y="1017" width="1465" height="57" fill="#f1f5f9" stroke="#cbd5e1" class="box"/>
  <text x="797" y="1042" text-anchor="middle" class="small">结构依据：WiLoR forward_step、ViT.forward_features、RefineNet.forward；配置采用 256 输入、15 个手指关节、6D 旋转表示。</text>
  <text x="797" y="1062" text-anchor="middle" class="small">注意：图中表达网络推理与训练监督关系；DataModule、优化器及训练器设置未展开。</text>
</svg>
